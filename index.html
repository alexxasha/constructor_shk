<style>
:root{--bg:#f6f0e8;--card:#fffdf9;--inp:#fff;--ink:#3b2f2a;--mut:#8a7b70;--acc:#a8704a;--acc2:#f1e3d3;--line:#e6d9cb}
:root[data-theme=dark]{--bg:#1c1816;--card:#262120;--inp:#1f1a18;--ink:#efe6dc;--mut:#a39587;--acc:#c98b5b;--acc2:#3a2f28;--line:#3b322c;color-scheme:dark}
:root[data-ex=oge]{--acc:#3f8f7d;--acc2:#e0efe9}
:root[data-theme=dark][data-ex=oge]{--acc:#5fb39f;--acc2:#233b35}
*{box-sizing:border-box}body{margin:0;font:13.5px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:7px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0}label.f{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}
select,input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--inp);padding:7px 14px;font:inherit;cursor:pointer;color:var(--ink)}.seg button.on{background:var(--acc);color:#fff}
.btn{border:1px solid var(--line);background:var(--inp);border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer;color:var(--ink)}.btn.main{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:var(--inp);padding:4px 6px;font:inherit;cursor:pointer;color:var(--ink);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:4px}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}.tabs b{background:var(--acc);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}.tabs button.on b{background:#fff;color:var(--acc)}
main{display:grid;grid-template-columns:clamp(250px,26vw,310px) minmax(0,1fr);gap:12px;padding:10px 14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tgrid{container-type:inline-size;column-count:2;column-gap:12px;margin-top:6px}
.tr{font-size:clamp(9.4px,calc((100cqw - 12px) / 72),13.5px);break-inside:avoid;margin-bottom:1px;display:flex;align-items:center;gap:4px;padding:2px .4em;border-radius:10px;border:1px solid transparent}.tr.on{background:var(--acc2);border-color:var(--acc)}
.num{border:0;background:none;font:inherit;font-weight:600;width:var(--nw,10.6em);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer;color:var(--ink);padding:4px}
.pills{display:flex;gap:3px}.dt{width:6.3em}#stw{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px;position:relative}.cal{position:fixed;top:50px;left:10px;max-width:calc(100vw - 20px);z-index:20;width:470px;max-height:calc(100vh - 70px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 8px 30px #0005;color:var(--ink)}.ch{display:flex;gap:6px;align-items:center;margin-bottom:6px}.ch b{flex:1;text-align:center;text-transform:capitalize}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.dw{font-style:normal;font-size:11px;color:var(--mut);text-align:center}.cd{min-height:58px;border-radius:7px;padding:2px 3px;font-size:10px;cursor:pointer;position:relative;overflow:hidden;border:1px solid transparent}.cd:hover{border-color:var(--acc)}.cd>b{font-size:12px}.cd.o{opacity:.4}.cd.w1{background:color-mix(in srgb,var(--acc) 24%,transparent)}.cd.w2{background:color-mix(in srgb,var(--acc) 9%,transparent)}.cd.td{outline:2px solid var(--ink);outline-offset:-2px}.cd.sl{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.cd u{position:absolute;top:1px;right:3px;text-decoration:none;background:var(--acc);color:#fff;border-radius:99px;font-size:9px;padding:0 5px}.ev{display:block;font-size:9.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px;margin-top:1px;background:var(--acc2)}.ev.l{background:color-mix(in srgb,#4a8 28%,transparent)}.ev.e{background:color-mix(in srgb,#d2584a 28%,transparent);color:#d2584a}.cw{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12px}.wk>div{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}.wk .ev{display:inline-block;max-width:100%;font-size:11px;padding:1px 6px}.chip.wkb{background:var(--acc);color:#fff;margin-left:3px}.dt2{width:6.3em}.tr:hover{background:var(--acc2)}.x{color:#d2584a;font-size:17px;line-height:1}.pill.ph{visibility:hidden}.pill.soon{opacity:.4}.pill.soon.a{opacity:.9}.row.soon{opacity:.5}.row.soon:has(input:checked){opacity:1}.pill{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:8px;min-width:2.5em;padding:1px .3em;font:inherit;font-size:.9em;cursor:pointer}
.pill.a{background:var(--acc);border-color:var(--acc);color:#fff}.pill:disabled{opacity:.35;cursor:not-allowed}
.chip{font-style:normal;font-size:.82em;padding:1px .6em;border-radius:99px;background:var(--acc2);color:var(--mut);white-space:nowrap}.chip.soon{background:transparent;border:1px dashed var(--mut)}
.qz{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mut);min-width:54px}
.row{display:flex;align-items:center;gap:8px;padding:2px 6px;border-radius:8px}.row .lb{flex:1}.row:hover{background:var(--acc2)}.row.dis{opacity:.4}.row.soon{opacity:.55}
input[type=checkbox]{width:17px;height:17px;padding:0;accent-color:var(--acc)}
.grp{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.ex{display:grid;grid-template-columns:48px 48px 96px 1fr;align-items:center;gap:8px;padding:4px 4px;border-bottom:1px solid var(--line)}.ex.s{grid-template-columns:48px 1fr}.ex .h{color:var(--mut);font-size:12px}
.side{position:sticky;top:50px;height:calc(100vh - 60px);display:flex;flex-direction:column;gap:8px}.plan{flex:1;min-height:0;display:flex;flex-direction:column}textarea{width:100%;resize:vertical;min-height:56px;font-size:11.5px}
pre{flex:1;min-height:80px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:12.5px;margin:6px 0;overflow:auto;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:12px}
.pgrid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr) minmax(300px,420px);gap:12px;align-items:start}body.beta .lt{display:none}#vw[hidden],#pm[hidden],#mn[hidden],.pkb[hidden]{display:none!important}body.beta #copy{display:none}.ig{display:flex;flex-wrap:wrap;gap:6px}.th{border:1px solid var(--line);background:var(--inp);border-radius:8px;padding:3px;cursor:pointer;width:84px;color:var(--ink);font:inherit;font-size:11px}.th img{width:100%;height:54px;object-fit:cover;object-position:top;border-radius:5px;display:block}.r{display:flex;gap:6px;align-items:center}.pstrip .seg{display:inline-flex}.pkb{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px}.pkc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;max-width:640px;max-height:84vh;overflow:auto}.pkc input{margin:6px 0;width:100%}.hint{white-space:nowrap}.pgrid2{display:grid;grid-template-columns:minmax(340px,1fr) minmax(0,1.2fr);gap:12px;align-items:start}.pstrip{margin-bottom:10px}@media(max-width:1000px){.pgrid2{grid-template-columns:1fr}}.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:8px!important}.pgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,480px);gap:12px;align-items:start}.cpy{cursor:copy}.cpy:hover{outline:2px solid var(--acc);outline-offset:-2px}.btn.dash{border-style:dashed;color:var(--mut)}#pm[hidden]{display:none!important}#pm .card{margin:0 0 8px}#pm .pill{font-size:12px}#pm .tr{font-size:12.5px}
@media(max-width:1000px){.pgrid2{grid-template-columns:1fr}}
@media(max-width:1300px){.lt{display:none}header{gap:6px 7px;padding:7px 10px}header .btn,header .seg button{padding:6px 9px}}.plan .bar b{white-space:nowrap}.plan .bar{flex-wrap:wrap}
@media(max-width:640px){header{position:static}.tgrid{column-count:1}
.tr{font-size:14px;flex-wrap:wrap;row-gap:2px;padding:4px 6px;border-radius:0}.tr.on{border-radius:8px}.num{width:auto;min-width:6.5em;flex:none}.dt,.dt2{width:auto;flex:1}
.pills{flex-basis:100%;gap:5px}.pill{min-width:2.8em;padding:4px .55em;font-size:.95em}.tgrid .tr+.tr{border-top:1px solid var(--line)}
.plan pre{max-height:45vh}.cal{width:auto}.cg .cd{min-height:50px}}
@media(max-width:900px){main{grid-template-columns:1fr}.side{position:static;height:auto}}}
</style></head><body>
<header><h1>Конструктор</h1><div class="seg" id="exs"><button data-x="ege">ЕГЭ</button><button data-x="oge">ОГЭ</button></div>
<div class="seg" id="tar"><button data-t="all">Всё включено</button><button data-t="self">Самопроверка</button></div>
<label class="f"><span class="lt">Смайлик 1</span> <select id="e1"></select></label><label class="f"><span class="lt">Смайлик 2</span> <select id="e2"></select></label>
<label class="f"><input id="ne" style="width:64px" size="4" maxlength="12" placeholder="свой"><button class="btn" id="na" title="Добавить смайлик в списки">＋</button><button class="btn" id="nd" title="Удалить добавленные смайлики">−</button></label>
<span id="stw"><span class="lt">Старт</span> <button class="btn" id="st"></button><div class="cal" id="cal" hidden></div></span><div class="cal" id="emp" hidden style="width:auto;min-width:210px"></div>
<span style="margin-left:auto"><button class="btn" id="th" title="Тема">◐</button></span></header>

<script>
const FILL='\u3164';
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function examTexts(s,st){const a=[],b=[],all=st.tariff==='all';
  if(!all)(s.selfwork||[]).forEach(w=>{if(st.sel[w.id]&&w.text)a.push(nl(w.text));});
  for(const i of s.items){
    if(i.group!==undefined)continue;
    if(st.sel[i.id]){const t=all?i.vAll:i.vSelf;if(t)b.push(nl(t));}
    if(all&&!closedEP(i)&&st.sel[i.id+'c']&&i.cAll)a.push(nl(i.cAll));
  }

function assemble(D,st){
  const out=[header(st.start)];

    if(s.noSelf&&st.tariff==='self')continue;   // например ДЗ на экспертную проверку недоступны в «Самопроверке»
    if(s.kind==='exam'){out.push(...examTexts(s,st));continue;}
    const it=s.items.filter(i=>st.sel[i.id]);
    if(!it.length)continue;
    if(s.intro1!==undefined)out.push(nl(it.length>1?s.introN:s.intro1));
    it.forEach(i=>{if(i.text)out.push(nl(i.text));});

const M3_=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],VAR_={'вес':'весь','зап':'запятые','дв':'двоеточия'},OPT_={sem1:'gk',summer:'lk',bonus:'bk',sem2:'g2',rep:'rp',click:'sc',kompl:'dz',quiz:'quiz'};

const pd_=(m,d)=>(m>=8?2026:2027)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');

    for(const it of s.items){if(it.group!==undefined)continue;
      const m=/^№\s*(\d+(?:-\d+)?)\s*(?:\((.*?)\))?\s*$/.exec(it.label);if(!m)continue;
      let par=m[2]||'',v='',date=it.date,tag='';
      if(par){const dm=/(\d{1,2})\.(\d{2})/.exec(par);if(dm){date=pd_(+dm[2],+dm[1]);par=(par.slice(0,dm.index)+par.slice(dm.index+dm[0].length)).trim();}

      const key=m[1],r=rows[key+'|'+v]=rows[key+'|'+v]||{key,var:v,label:'№'+key+(v?' ('+v+')':''),opts:{}};
      if(it.sort!==undefined&&r.sort===undefined)r.sort=+it.sort;const o={id:it.id};if(date)o.date=date;if(tag)o.tag=tag;if(!it.text)o.off=1;

let cmY,cmM;

    h+=`<div class="cd${d.getMonth()!==cmM?' o':''}${w?' w'+(w%2?1:2):''}${k===TODAY?' td':''}${k===sel?' sl':''}" data-d="${k}" title="${esc(ev.map(e=>e.f).join('\n'))}"><b>${d.getDate()}</b>${w&&df%7===0?`<u>${w}</u>`:''}${ev.slice(0,2).map(e=>`<span class="ev ${e.t}">${e.t==='e'?'✕ ':''}${esc(e.s)}</span>`).join('')}${ev.length>2?`<span class="ev">+${ev.length-2}</span>`:''}</div>`}
  h+='</div><div class="cw">';
  for(let w=1;w<=4;w++){const a=dn(sd+(w-1)*7),b=dn(sd+w*7-1),it=[];
    for(let i=0;i<7;i++){const d=dn(sd+(w-1)*7+i);(E[ymd(d)]||[]).forEach(e=>it.push(`<span class="ev ${e.t}" title="${esc(e.f)}"><b>${d.getDate()}</b> ${e.t==='e'?'✕ ':''}${esc(e.f.length>36?e.f.slice(0,35)+'…':e.f)}</span>`))}
    h+=`<div class="wk"><b>Неделя ${w}</b> <span class="mut">${a.getDate()} ${M3[a.getMonth()]} – ${b.getDate()} ${M3[b.getMonth()]}</span><div>${it.join('')||'<span class="mut">ничего не выходит</span>'}</div></div>`}
  if(nod.length)h+=`<div class="mut">Без точной даты (ожидаются): ${esc(nod.join(', '))}</div>`;
  $('#cal').innerHTML=h+'</div>'}
const stLabel=()=>{const s=st.start;$('#st').textContent=DOW[(s.getDay()+6)%7]+' '+s.getDate()+' '+M3[s.getMonth()]},upd=()=>{stLabel();view();renderCal()};
$('#st').onclick=()=>{if($('#cal').hidden){cmY=st.start.getFullYear();cmM=st.start.getMonth();renderCal();const c=$('#cal'),r=$('#st').getBoundingClientRect();c.hidden=false;c.style.top=(r.bottom+6)+'px';c.style.left=Math.max(10,Math.min(r.right-470,innerWidth-480))+'px'}else $('#cal').hidden=true};

  if(c){st.start=pdt(c.dataset.d);st.manual=true;upd()}};

setInterval(autoDay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoDay()});addEventListener('focus',autoDay);

  const b=$('#copy');b.textContent='Скопировано ✓';setTimeout(()=>b.textContent='Копировать план',1500)};
