<style>
:root{--bg:#f6f0e8;--card:#fffdf9;--inp:#fff;--ink:#3b2f2a;--mut:#8a7b70;--acc:#a8704a;--acc2:#f1e3d3;--line:#e6d9cb}
:root[data-theme=dark]{--bg:#1c1816;--card:#262120;--inp:#1f1a18;--ink:#efe6dc;--mut:#a39587;--acc:#c98b5b;--acc2:#3a2f28;--line:#3b322c;color-scheme:dark}
:root[data-ex=oge]{--acc:#3f8f7d;--acc2:#e0efe9}
:root[data-theme=dark][data-ex=oge]{--acc:#5fb39f;--acc2:#233b35}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--inp);padding:5px 12px;font:inherit;cursor:pointer;color:var(--ink)}.seg button.on{background:var(--acc);color:#fff}
*{box-sizing:border-box}body{margin:0;font:13.5px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0 8px 0 0}input,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink);width:100%}
input[type=checkbox]{width:auto}textarea{min-height:80px;resize:vertical;font-size:12.5px}input.w{width:150px;flex:none}
.btn{border:1px solid var(--line);background:var(--inp);border-radius:9px;padding:4px 10px;font:inherit;cursor:pointer;color:var(--ink);width:auto}.btn.main{background:var(--acc);color:#fff;border-color:var(--acc)}
main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;padding:12px 16px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:56px;max-height:calc(100vh - 70px);overflow:auto}.nv{display:flex;align-items:center;gap:3px;border-radius:9px}.nv.on{background:var(--acc2)}
.nv button.t{flex:1;text-align:left;border:0;background:none;font:inherit;padding:6px 8px;cursor:pointer;color:var(--ink)}.nv .btn{padding:1px 6px;font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:6px}.g{background:var(--acc2)}
.r{display:flex;gap:6px;align-items:center}.mut{color:var(--mut);font-size:12px;white-space:nowrap}label.l{display:block;font-size:11px;color:var(--mut);margin:5px 0 2px}
h3{margin:12px 0 6px;font-size:13px;color:var(--mut)}.msg{padding:6px 16px;font-size:12px;color:var(--mut)}
@media(max-width:900px){main{grid-template-columns:1fr}nav{position:static;max-height:none}}
</style></head><body>
<header><h1>Админка</h1><div class="seg" id="exs"><button data-x="ege">ЕГЭ</button><button data-x="oge">ОГЭ</button></div><input id="q" placeholder="Поиск по всем шаблонам…" style="max-width:300px"><span class="mut" id="src"></span><span style="margin-left:auto;display:flex;gap:6px">
<button class="btn" id="th">◐</button><button class="btn" id="dr">Скачать черновик</button><button class="btn main" id="pub">Скачать для публикации</button></span></header>
<div class="msg">Правки живут на этой странице, пока вы не скачали файл. Скачали → загрузили на хостинг вместо старого (черновик: data-draft.json, публикация: data.json). Новые пункты добавляются в конец группы и показаны сверху.</div>
<main><nav id="nav"></nav><section id="ed"></section></main>
<script>
const $=s=>document.querySelector(s);let D,cur=0,q='',dirty=false,view='',armed='',armT;const open=new Set();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pd_=(mo,d)=>(mo>=8?2026:2027)+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const epISO=s=>{if(!s)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const k=/(\d{1,2})\.(\d{2})/.exec(s);return k?pd_(+k[2],+k[1]):''};
const normEp=D=>D.sections.forEach(s=>s.items.forEach(i=>{if(i.group===undefined&&i.ep&&!/^\d{4}-\d{2}-\d{2}$/.test(i.ep)){const e=epISO(i.ep);if(e)i.ep=e}}));
const DEF={essay:'Сочинение',is:'ИС',ishw:'ИС',org:'Орг. вебинары'},OPTS=['sem1','summer','bonus','sem2','rep','click','kompl','quiz'];
let EX=(()=>{try{return localStorage.getItem('exam')==='oge'?'oge':'ege'}catch(e){return'ege'}})(),sw=false;
const FILES=()=>EX==='oge'?['data-oge-draft.json','data-oge.json']:['data-draft.json','data.json'];
async function load(){D=null;$('#src').textContent='';for(const f of FILES()){try{const r=await fetch(f+'?v='+Date.now());if(r.ok){D=await r.json();normEp(D);$('#src').textContent='Открыт: '+f;break}}catch(e){}}
  if(!D){if(EX==='oge'){D={sections:[]};$('#src').textContent='Файл data-oge.json не найден: начат пустой набор ОГЭ'}else{$('#ed').innerHTML='<p>Не удалось загрузить data.json. Откройте админку по ссылке на сайте.</p>';return}}draw()}
const exMark=()=>{document.documentElement.dataset.ex=EX;document.querySelectorAll('#exs button').forEach(b=>b.classList.toggle('on',b.dataset.x===EX))};
$('#exs').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.x===EX)return;
  if(dirty&&!sw){sw=true;$('#src').textContent='Есть несохранённые правки! Скачайте файл или нажмите ещё раз: переключение без сохранения.';setTimeout(()=>sw=false,5000);return}
  sw=false;EX=b.dataset.x;try{localStorage.setItem('exam',EX)}catch(e){}dirty=false;cur=0;q='';$('#q').value='';view='';exMark();load()};
function nav(){$('#nav').innerHTML=D.sections.map((s,i)=>`<div class="nv ${i===cur&&!q&&!view?'on':''}"><button class="t" data-a="go" data-i="${i}">${esc(s.title)} <span class="mut">${s.items.filter(x=>x.group===undefined).length}</span></button><button class="btn" data-a="sup" data-i="${i}">▲</button><button class="btn" data-a="sdn" data-i="${i}">▼</button></div>`).join('')+'<button class="btn" data-a="ns" style="margin-top:8px">＋ Новый раздел</button> <button class="btn" data-a="sch" style="margin-top:4px">📐 Схемы подготовки</button> <button class="btn" data-a="txt" style="margin-top:4px">✎ Тексты сообщений</button><p class="mut" style="white-space:normal">Порядок разделов = порядок блоков в готовом плане.</p>'}
const fl=(a,f,l,v)=>`<label class="l">${l}</label><textarea ${a} data-f="${f}">${esc(v)}</textarea>`;
function card(x,i){const s=D.sections[x],it=s.items[i],ex=s.kind==='exam',o=open.has(it.id),a=`data-x="${x}" data-i="${i}"`;
  let h=`<div class="card"><div class="r"><button class="btn" data-a="tg" ${a}>${o?'▾':'▸'}</button><input ${a} data-f="label" value="${esc(it.label)}" placeholder="Название">`
   +(ex?`<input class="w" type="date" ${a} data-f="ep" value="${esc(epISO(it.ep))}" title="Дата закрытия ЭП"><label class="mut"><input type="checkbox" ${a} data-f="closed" ${it.closed?'checked':''}> ЭП закрыта</label>`:`<input class="w" type="date" ${a} data-f="date" value="${esc(it.date)}" title="Дата выхода">${OPTS.includes(s.id)?`<input class="w" style="width:84px" type="number" ${a} data-f="sort" value="${esc(it.sort)}" placeholder="позиция" title="Позиция в списке «Тест»: число, по которому номер встаёт среди остальных (например 100 — в самый конец). Пусто = по номеру.">`:''}`)
   +(s.ep&&!ex?`<input class="w" type="date" ${a} data-f="ep" value="${esc(epISO(it.ep))}" title="Дата закрытия ЭП"><label class="mut"><input type="checkbox" ${a} data-f="closed" ${it.closed?'checked':''}> закрыта</label>`:'')
   +`<button class="btn" data-a="up" ${a}>▲</button><button class="btn" data-a="dn" ${a}>▼</button><button class="btn" data-a="del" ${a}>✕</button></div>`;
  if(o)h+=ex?fl(a,'vAll','Всё включено: весь пробник',it.vAll)+(s.noEssay?'':fl(a,'cAll','Всё включено: сочинение из пробника',it.cAll))+fl(a,'vSelf','Самопроверка: пробник',it.vSelf):fl(a,'text','Текст шаблона',it.text);
  return h+'</div>'}
function segs(it){const r=[];let s={h:-1,a:0,b:-1};it.forEach((x,i)=>{if(x.group!==undefined){r.push(s);s={h:i,a:i+1,b:i}}else s.b=i});r.push(s);return r.length>1&&r[0].b<0?r.slice(1):r}
function ed(){if(view==='sch'&&!q){schView();return}if(view==='txt'&&!q){txtView();return}let h='';
  if(q){const f=q.toLowerCase();D.sections.forEach((s,x)=>{const m=s.items.map((it,i)=>i).filter(i=>{const it=s.items[i];return it.group===undefined&&((it.label||'').toLowerCase().includes(f)||(it.text||it.vAll||'').toLowerCase().includes(f))});
    if(m.length)h+=`<h3>${esc(s.title)}</h3>`+m.reverse().map(i=>card(x,i)).join('')});$('#ed').innerHTML=h||'<p class="mut">Ничего не найдено</p>';return}
  const x=cur,s=D.sections[x],ex=s.kind==='exam',a=`data-x="${x}"`;
  h=`<div class="card"><div class="r"><input ${a} data-s="title" value="${esc(s.title)}" style="font-weight:600"><button class="btn main" data-a="grp" ${a} title="Новая группа в самом верху раздела">＋ Группа наверх</button><button class="btn" data-a="grpb" ${a} title="Новая группа в самом низу раздела">＋ Группа вниз</button>${segs(s.items)[0].h<0&&s.items.length?`<button class="btn" data-a="grp0" ${a} title="Добавить название над самыми первыми пунктами">＋ Подпись сверху</button>`:''}<button class="btn" data-a="col" ${a}>Свернуть всё</button></div>`;
  if(!ex){h+=fl(`${a} data-s="1"`,'intro1','Текст перед блоком (если выбран один пункт)',s.intro1)+fl(`${a} data-s="1"`,'introN','Текст перед блоком (если выбрано несколько)',s.introN)+fl(`${a} data-s="1"`,'outro','Текст после блока',s.outro);
    h+=`<div class="mut" style="white-space:normal;margin-top:4px">${OPTS.includes(s.id)?'Пункты этого раздела показаны на сайте во вкладке «Тест» (плашками у номеров). Название раздела видно только здесь.':'Название раздела видно только здесь. Как называется вкладка на сайте, задаётся полем ниже.'}</div>`;
    if(!OPTS.includes(s.id)){const et=s.tab||DEF[s.id]||'';h+=`<label class="l">Название вкладки на сайте (переименует её у всех разделов, которые в ней лежат; нажмите Enter или кликните мимо)</label><input ${a} data-s="1" data-f="tab" data-old="${esc(et)}" value="${esc(et)}" list="tabs"><datalist id="tabs"><option>Сочинение<option>ИС<option>Орг. вебинары</datalist>`}}
  else h+=s.selfwork.map((w,k)=>`<label class="l">Самост. работа (Самопроверка): название</label><input ${a} data-w="${k}" data-f="label" value="${esc(w.label)}"><label class="l">Текст</label><textarea ${a} data-w="${k}" data-f="text">${esc(w.text)}</textarea>`).join('');
  const fx=(f,l)=>`<label class="mut" style="display:inline-flex;gap:5px;align-items:center;margin:6px 14px 0 0;white-space:normal"><input type="checkbox" data-x="${x}" data-s="1" data-f="${f}" ${s[f]?'checked':''}> ${l}</label>`;

    h+=`<button class="btn main" data-a="add" ${a} data-at="${g.b+1}" style="margin-bottom:6px">＋ Добавить ${ex?'пробник':'пункт'}${g.h>=0?' в «'+esc(s.items[g.h].group)+'»':''}</button>`;
    for(let i=g.b;i>=g.a;i--)h+=card(x,i)}
  $('#ed').innerHTML=h}
const draw=()=>{nav();ed()};
function blocksOf(it){const B=[];let c=null;it.forEach(x=>{if(x.group!==undefined){c=[x];B.push(c)}else{if(!c){c=[];B.push(c)}c.push(x)}});return B}
const ensureHeader=it=>{if(it.length&&it[0].group===undefined)it.unshift({group:''})};   // пункты без названия получают пустую группу, чтобы их можно было двигать
function moveGroup(it,h,d){const B=blocksOf(it),k=B.findIndex(b=>b[0]===h),j=k+d;if(k<0||j<0||j>=B.length)return;[B[k],B[j]]=[B[j],B[k]];it.length=0;B.forEach(b=>it.push(...b))}
function mv(it,i,d){const j=i+d;if(j<0||j>=it.length)return;if(it[i].group!==undefined||it[j].group!==undefined&&it[i].group===undefined)return;[it[i],it[j]]=[it[j],it[i]];dirty=true}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;q='';$('#q').value='';view=a==='sch'?'sch':a==='txt'?'txt':'';
  if(a==='go')cur=i;else if(a==='sup'||a==='sdn'){const d=a==='sup'?-1:1,j=i+d;if(j>=0&&j<D.sections.length){[D.sections[i],D.sections[j]]=[D.sections[j],D.sections[i]];cur=cur===i?j:cur===j?i:cur;dirty=true}}
  else if(a==='ns'){const t='Новый раздел';D.sections.push({id:'s'+Date.now().toString(36),title:t,kind:'blocks',items:[],tab:t});cur=D.sections.length-1;dirty=true}draw()};
$('#ed').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,x=+b.dataset.x,s=D.sections[x],i=+b.dataset.i;if(!s)return;const it=s.items;
  if(a==='tg'){const k=it[i].id;open.has(k)?open.delete(k):open.add(k)}
  else if(a==='col')open.clear();
  else if(a==='up')mv(it,i,1);else if(a==='dn')mv(it,i,-1);   // на экране «выше» = позже в плане
  else if(a==='del'){const k=x+':'+i;if(armed!==k){armed=k;b.textContent='Точно?';b.style.color='#d2584a';clearTimeout(armT);armT=setTimeout(()=>{armed='';ed()},3000);return}armed='';clearTimeout(armT);it.splice(i,1);dirty=true}
  else if(a==='add'){const n={id:'n'+Date.now().toString(36),label:'',text:''};if(s.kind==='exam')Object.assign(n,{vAll:'',vSelf:'',cAll:'',cSelf:'',ep:''});it.splice(+b.dataset.at,0,n);open.add(n.id);dirty=true}
  else if(a==='grp'){ensureHeader(it);it.unshift({group:''});dirty=true}else if(a==='grpb'){it.push({group:''});dirty=true}else if(a==='grp0'){it.unshift({group:''});dirty=true}else if(a==='gup'||a==='gdn'){const h=it[i];ensureHeader(it);moveGroup(it,h,a==='gup'?-1:1);dirty=true}else return;ed();if(a==='grp'||a==='grpb'){const gs=[...document.querySelectorAll('#ed .card.g input')];(a==='grp'?gs[0]:gs[gs.length-1])?.focus()}};
$('#ed').oninput=e=>{const t=e.target,s=D.sections[+t.dataset.x],f=t.dataset.f;if(!s||f==='tab')return;dirty=true;const v=t.type==='checkbox'?(t.checked||undefined):t.value;
  let o;if(t.dataset.s)o=s,t.dataset.s==='title'&&(s.tab===s.title&&(s.tab=t.value),o.title=t.value);else if(t.dataset.w!==undefined)o=s.selfwork[+t.dataset.w];else o=s.items[+t.dataset.i];
  if(t.dataset.s==='title')return;if(v===undefined||(v===''&&(f==='date'||f==='tab'||f==='sort'||f==='ep')))delete o[f];else o[f]=f==='sort'?+v:v};
$('#ed').onchange=e=>{const t=e.target;if(t.dataset.f!=='tab'||t.dataset.s===undefined)return;const old=t.dataset.old,nw=t.value.trim();if(!nw||nw===old)return;D.sections.forEach(z=>{if((z.tab||DEF[z.id])===old)z.tab=nw});dirty=true;draw()};
$('#q').oninput=e=>{q=e.target.value.trim();view='';nav();ed()};

const TYPES_=[['test','Тестовый номер'],['essay','Занятие по сочинению'],['izl','Занятие по изложению (ОГЭ)'],['is','Занятие по ИС'],['mock:full','Пробник: полноценный'],['mock:test','Пробник: тестовая часть'],['mock:essay','Пробник: сочинение'],['self','Самостоятельная работа'],['quiz','Квиз']];

function schEditor(s,i){const a=`data-sc="${i}"`;
  return `<div style="margin-top:8px"><label class="l">Название</label><input ${a} data-f="name" value="${esc(s.name)}"><div class="r" style="margin-top:6px"><select ${a} data-f="tariff"><option value="all" ${s.tariff==='all'?'selected':''}>Всё включено</option><option value="self" ${s.tariff==='self'?'selected':''}>Самопроверка</option></select><select ${a} data-f="load">${[...new Set([...LOADS_,s.load])].map(v=>`<option ${v===s.load?'selected':''}>${esc(v)}</option>`).join('')}</select><label class="mut" style="white-space:nowrap"><input type="checkbox" ${a} data-f="is" ${s.is?'checked':''}> с ИС</label></div>
  <label class="l">Сообщение 1 · общая схема</label><textarea ${a} data-f="message1" style="min-height:150px">${esc(s.message1)}</textarea>
  <div class="r" style="margin-top:8px"><b style="flex:1">Недели и занятия</b><button class="btn" data-a="sc_aw" data-i="${i}">＋ Неделя</button></div>
  ${s.weeks.map((w,wi)=>`<div class="card" style="margin:6px 0"><div class="r"><b style="flex:1">Неделя ${wi+1}</b><button class="btn" data-a="sc_dw" data-i="${i}" data-w="${wi}">Удалить неделю</button></div>${w.map((sl,si)=>`<div class="r" style="margin-top:4px"><select ${a} data-f="slot" data-w="${wi}" data-s="${si}">${TYPES_.map(([v,l])=>`<option value="${v}" ${tv_(sl)===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn" data-a="sc_dsl" data-i="${i}" data-w="${wi}" data-s="${si}">✕</button></div>`).join('')}<button class="btn" style="margin-top:6px" data-a="sc_asl" data-i="${i}" data-w="${wi}">＋ Занятие</button></div>`).join('')}</div>`}
const DTX=[['hdr_upd','Заголовок распределения (обновление)','💙 Обновляю распределение:'],['hdr_new','Заголовок распределения (новый ученик)','💙 Предлагаю Вам следующее распределение занятий. Оно составлено на ближайшие три недели с упором на материалы курса:'],['sep','Разделитель (пустая строка)','⠀⠀'],['wk_done','Пройденная неделя ({n} — номер)','{n} неделя (+)'],['wk_cur','Текущая неделя','{n} неделя (текущая)'],['wk_next','Будущая неделя','{n} неделя'],['join','Между занятиями в неделе',' + '],['grade','Строка класса ({grade}, {year})','➡️ {grade} класс, {year}'],['load','Строка нагрузки ({load}, {is})','➡️ {load}{is}'],['is_yes','Добавка к нагрузке, если есть ИС',' + ИС'],['is_no','Добавка, если ИС нет (можно пусто)',''],['sum_head','Заголовок сводки','✔️ Сводка по изученному материалу'],['sum_t','Заголовок: изученные номера','🔶 Изученные номера:'],['sum_e','Заголовок: просмотренные занятия','🔶 Просмотренные занятия:'],['sum_m','Заголовок: решённые пробники','🔶 Решённые пробники:'],['sum_i','Заголовок: ИС','🔶 ИС:'],['c_gk','Годовой курс','Годовой курс'],['c_lk','Летний курс','Летний курс'],['c_bk','Бонусный курс','Бонусный курс'],['dash','Пусто (если ничего нет)','–'],['sfx_lk','Пометка летнего курса у номера',' (ЛК)'],['sfx_bk','Пометка бонусного курса у номера',' (БК)'],['sfx_dz','Пометка комплексного ДЗ (для нагрузки до 4 часов)',' (компл. ДЗ)'],['sl_test','Слот: тестовый номер','тестовый номер'],['sl_essay','Слот: занятие по сочинению','занятие по сочинению'],['sl_izl','Слот: занятие по изложению','занятие по изложению'],['sl_self','Слот: самостоятельная работа','самостоятельная работа'],['sl_is','Слот: занятие по ИС','занятие по ИС'],['sl_quiz','Слот: квиз','квиз'],['sl_mock_full','Слот: полноценный пробник','полноценный пробник'],['sl_mock_essay','Слот: сочинение из пробника','сочинение из пробника'],['sl_mock_test','Слот: тестовая часть пробника','тестовая часть пробника']];
